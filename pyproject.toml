[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pangenome-town"
version = "0.1.0"
description = "Gas City pack and tooling for a lab-hosted pangenome town in The Academic Wasteland"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "wasteland-starter-pack @ git+https://github.com/academic-wasteland/wasteland-starter-pack@9825f980a72bb11463cd51c1b18313f0ef34e0f0",
  "cryptography>=43",
  "numpy>=1.26,<3",
  "reportlab>=4,<5",
  "research-commons-conformance @ git+https://github.com/academic-wasteland/research-commons@receiver-assertions",
]

[project.optional-dependencies]
literature = []  # Compatibility extra; the shared workspace now requires the starter runtime.
dev = ["pytest>=8.3,<9", "ruff>=0.6"]

[project.scripts]
pangenome-town = "pangenome_town.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pangenome_town"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
"contract/pangenome.ofn.tmpl" = "pangenome_town/rcp/pangenome.ofn.tmpl"
