name: Town checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  town:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y bcftools
      - run: python -m pip install '.[dev,literature]'
      - uses: actions/checkout@v4
        with:
          repository: micheldumontier/zerzura
          ref: fa77cd1b50e78fa6d1056d6f4ba2665eb0f36f5d
          path: external/zerzura
      - run: python -m pytest -q
        env:
          ZERZURA_SOURCE: external/zerzura
  keycloak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev,literature]'
      - run: python examples/keycloak_demo.py
